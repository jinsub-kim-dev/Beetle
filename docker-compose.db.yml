# DB 서버 호스트 구성 — MySQL 만 띄우고 앱 서버에서 접속할 수 있게 포트를 노출한다.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                  -f docker-compose.db.yml up -d
#
# **포트를 여는 만큼 방화벽으로 좁혀야 한다.** 같은 네트워크의 다른 기기가 붙을 수 있다.
#   sudo ufw allow from <앱 서버 IP> to any port 3306 proto tcp
services:
  # 이 호스트에서는 애플리케이션을 띄우지 않는다.
  backend:
    profiles: ["unused"]
  frontend:
    profiles: ["unused"]

  mysql:
    # 앱 서버가 접속할 포트. 특정 인터페이스에만 열려면 DB_BIND 를 그 주소로 지정한다.
    ports:
      - "${DB_BIND:-0.0.0.0}:${DB_PORT:-3306}:3306"
