server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅: 실제 파일이 없으면 index.html 로 넘겨 클라이언트 라우터가 처리한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 는 백엔드로 프록시한다. 브라우저가 보는 오리진이 하나로 유지되므로
    # CORS 설정이 필요 없다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 문서와 헬스체크도 같은 오리진으로 노출한다.
    #
    # `/swagger-ui.html` 은 정확히 일치(=)로 잡아야 한다. 접두사 `/swagger-ui/` 에
    # 걸리지 않아 SPA 폴백으로 넘어가면, 문서를 열었을 때 앱 화면이 나온다.
    # 배포(prod) 프로필은 문서를 끄므로 이 경로들이 백엔드의 404 를 그대로 돌려준다.
    location = /swagger-ui.html { proxy_pass http://backend:8080; }
    location /swagger-ui/ { proxy_pass http://backend:8080; }
    location /v3/api-docs { proxy_pass http://backend:8080; }
    # actuator 는 헬스체크만 내보낸다. /actuator/prometheus 는 JVM 내부와 요청 통계를
    # 드러내므로 LAN 에도 열지 않는다. 지표는 같은 도커 네트워크의 Prometheus 만 읽는다.
    location = /actuator/health { proxy_pass http://backend:8080; }
    location /actuator/ { return 404; }

    # 해시가 붙은 정적 자산은 오래 캐싱한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
