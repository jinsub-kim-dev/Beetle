server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅: 실제 파일이 없으면 index.html 로 넘겨 클라이언트 라우터가 처리한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 는 백엔드로 프록시한다. 브라우저가 보는 오리진이 하나로 유지되므로
    # CORS 설정이 필요 없다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 문서와 헬스체크도 같은 오리진으로 노출한다.
    location /swagger-ui/ { proxy_pass http://backend:8080; }
    location /v3/api-docs { proxy_pass http://backend:8080; }
    location /actuator/ { proxy_pass http://backend:8080; }

    # 해시가 붙은 정적 자산은 오래 캐싱한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
