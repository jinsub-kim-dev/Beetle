# 앱 서버 호스트 구성 — 백엔드와 프론트엔드만 띄우고 DB 는 다른 호스트를 쓴다.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                  -f docker-compose.app.yml up -d
#
# `.env` 에 DB 서버의 주소(DB_HOST)와 그쪽이 노출한 포트(DB_PORT_TARGET)를 넣는다.
services:
  # 이 호스트에서는 DB 를 띄우지 않는다. 프로필을 붙여 기본 기동 대상에서 뺀다.
  mysql:
    profiles: ["unused"]

  backend:
    environment:
      DB_HOST: ${DB_HOST:?DB 서버 주소(DB_HOST)를 설정해야 합니다}
      DB_PORT: ${DB_PORT_TARGET:?DB 서버가 노출한 포트(DB_PORT_TARGET)를 설정해야 합니다}
    # 같은 호스트에 mysql 이 없으므로 헬스체크 의존을 걷어낸다.
    # DB 가 아직 준비되지 않았으면 백엔드가 기동에 실패하고 restart 정책이 다시 시도한다.
    depends_on: !reset []
