# 로컬 개발 프로필 (기본값).
#
# 목표는 "받아서 바로 뜨는 것" 이다. 환경 변수를 하나도 설정하지 않아도
# docker-compose 로 띄운 MySQL 에 붙는다.
beetle:
  db:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:3306}
    name: ${DB_NAME:beetle}
    user: ${DB_USER:beetle}
    password: ${DB_PASSWORD:beetlepassword}

spring:
  flyway:
    # 로컬에서는 시드 데이터를 함께 넣는다. 손으로 데이터를 만들지 않아도
    # 화면이 채워져 있어야 개발과 확인이 빠르다.
    locations: classpath:db/migration,classpath:db/seed
    # 이미 테이블이 있는 로컬 DB 에도 붙을 수 있게 허용한다.
    baseline-on-migrate: true

  jpa:
    # 쿼리를 눈으로 확인해야 하는 환경이다.
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  error:
    # 로컬에서는 원인을 바로 보는 편이 낫다.
    include-message: always
    include-binding-errors: always

# API 문서는 개발 환경에서만 노출한다.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,mappings
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.beetle: DEBUG
