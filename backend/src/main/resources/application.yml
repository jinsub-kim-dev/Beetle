spring:
  application:
    name: beetle

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:beetle}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:beetle}
    password: ${DB_PASSWORD:beetlepassword}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    # 스키마는 Flyway 로만 관리한다. Hibernate 는 검증만 수행한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    # Jackson 3 은 날짜/시간을 기본적으로 ISO-8601 문자열로 직렬화한다.
    # (WRITE_DATES_AS_TIMESTAMPS 는 SerializationFeature 에서 제거되었다)
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.example.beetle: DEBUG
